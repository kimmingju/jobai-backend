name: CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 077660206269.dkr.ecr.ap-northeast-2.amazonaws.com
  BACKEND_IMAGE: 077660206269.dkr.ecr.ap-northeast-2.amazonaws.com/jobai-backend
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_DIR: /home/ubuntu/jobai

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Build and push backend image
        run: |
          docker build -t "${BACKEND_IMAGE}:${IMAGE_TAG}" -t "${BACKEND_IMAGE}:latest" .
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Prepare deployment files
        run: |
          mkdir -p .deploy/nginx
          cp docker-compose.prod.yml .deploy/docker-compose.prod.yml
          cp infra/nginx/jobai-upload-size.conf .deploy/nginx/jobai-upload-size.conf
          cp infra/nginx/jobai-websocket-proxy.conf .deploy/nginx/jobai-websocket-proxy.conf

          cat > .deploy/remote-deploy.sh <<'SCRIPT'
          set -e

          DEPLOY_DIR="/home/ubuntu/jobai"
          PARAM_PATH="/jobai/prod/env"
          AWS_REGION="ap-northeast-2"

          get_param() {
            local value
            value=$(aws ssm get-parameter \
              --region "${AWS_REGION}" \
              --name "${PARAM_PATH}/$1" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text 2>/dev/null || true)

            if [ "${value}" = "__EMPTY__" ]; then
              value=""
            fi

            printf '%s' "${value}"
          }

          mkdir -p "${DEPLOY_DIR}"
          cp /tmp/jobai-deploy/docker-compose.prod.yml "${DEPLOY_DIR}/docker-compose.prod.yml"

          if ! command -v nginx >/dev/null 2>&1; then
            echo "nginx is required for API reverse proxy but is not installed"
            exit 1
          fi

          mkdir -p /etc/nginx/conf.d
          cp /tmp/jobai-deploy/nginx/jobai-upload-size.conf /etc/nginx/conf.d/jobai-upload-size.conf
          cp /tmp/jobai-deploy/nginx/jobai-websocket-proxy.conf /etc/nginx/conf.d/jobai-websocket-proxy.conf

          if [ -f /etc/nginx/sites-enabled/jobai-api ] \
            && ! grep -q "proxy_set_header Upgrade" /etc/nginx/sites-enabled/jobai-api; then
            sed -i '/proxy_http_version 1.1;/a\
          proxy_set_header Upgrade $http_upgrade;\
          proxy_set_header Connection $connection_upgrade;\
          proxy_read_timeout 3600s;\
          proxy_send_timeout 3600s;' /etc/nginx/sites-enabled/jobai-api
          fi

          nginx -t
          systemctl reload nginx

          cat > "${DEPLOY_DIR}/.env" <<ENV
          ECR_REGISTRY=$(get_param ECR_REGISTRY)
          IMAGE_TAG=$(get_param IMAGE_TAG)
          SPRING_PROFILES_ACTIVE=$(get_param SPRING_PROFILES_ACTIVE)
          SPRING_PORT=$(get_param SPRING_PORT)
          FASTAPI_PORT=$(get_param FASTAPI_PORT)
          REDIS_PORT=$(get_param REDIS_PORT)
          REDIS_PASSWORD=$(get_param REDIS_PASSWORD)
          AI_SERVER_BASE_URL=$(get_param AI_SERVER_BASE_URL)
          POSTGRES_HOST=$(get_param POSTGRES_HOST)
          POSTGRES_PORT=$(get_param POSTGRES_PORT)
          POSTGRES_DB=$(get_param POSTGRES_DB)
          POSTGRES_USER=$(get_param POSTGRES_USER)
          POSTGRES_PASSWORD=$(get_param POSTGRES_PASSWORD)
          APP_FRONTEND_REDIRECT_URL=$(get_param APP_FRONTEND_REDIRECT_URL)
          GOOGLE_CLIENT_ID=$(get_param GOOGLE_CLIENT_ID)
          GOOGLE_CLIENT_SECRET=$(get_param GOOGLE_CLIENT_SECRET)
          JWT_SECRET=$(get_param JWT_SECRET)
          WEBSOCKET_ALLOWED_ORIGINS=$(get_param WEBSOCKET_ALLOWED_ORIGINS)
          AWS_REGION=$(get_param AWS_REGION)
          S3_BUCKET_NAME=$(get_param S3_BUCKET_NAME)
          DATA_GO_KR_SERVICE_KEY=$(get_param DATA_GO_KR_SERVICE_KEY)
          SES_FROM_EMAIL=$(get_param SES_FROM_EMAIL)
          ANTHROPIC_API_KEY=$(get_param ANTHROPIC_API_KEY)
          OPENAI_API_KEY=$(get_param OPENAI_API_KEY)
          SENDGRID_USERNAME=$(get_param SENDGRID_USERNAME)
          SENDGRID_PASSWORD=$(get_param SENDGRID_PASSWORD)
          ENV

          cd "${DEPLOY_DIR}"
          DEPLOY_AWS_REGION="$(get_param AWS_REGION)"
          if [ -z "${DEPLOY_AWS_REGION}" ]; then
            DEPLOY_AWS_REGION="${AWS_REGION}"
          fi

          aws ecr get-login-password --region "${DEPLOY_AWS_REGION}" \
            | docker login --username AWS --password-stdin "$(get_param ECR_REGISTRY)"

          # 되돌릴 대상: 지금 돌고 있는 이미지의 태그
          PREVIOUS_TAG=$(docker inspect --format '{{.Config.Image}}' jobai-spring 2>/dev/null | sed 's/.*://' || true)
          echo "previous tag: ${PREVIOUS_TAG:-none}"

          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d

          # 배포 검증. 컨테이너가 떴다고 앱이 동작하는 것은 아니다.
          # 2026-09-02 트랜잭션 설정 오류로 업로드가 전부 500이었으나 배포는 성공으로 처리됐다.
          verify() {
            for _ in $(seq 1 40); do
              curl -fsS -m 5 http://localhost:9090/actuator/health >/dev/null 2>&1 && break
              sleep 5
            done
            curl -fsS -m 10 http://localhost:9090/actuator/health >/dev/null 2>&1 || return 1
            curl -fsS -m 15 'http://localhost:8080/api/v1/home/latest-jobs' >/dev/null 2>&1 || return 1
            curl -fsS -m 15 'http://localhost:8080/api/search/jobs?query=backend&page=0&size=5' >/dev/null 2>&1 || return 1
            # 쓰기 경로: 인증이 필요하므로 401이 정상이고, 5xx면 트랜잭션/DB 설정이 깨진 것이다.
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST http://localhost:8080/api/v1/members/resumes)
            case "$code" in 5*) echo "write path returned $code"; return 1 ;; esac
            return 0
          }

          if verify; then
            echo "deployment verified"
            docker image prune -f
          else
            echo "verification failed, rolling back to ${PREVIOUS_TAG:-none}"
            if [ -n "${PREVIOUS_TAG}" ]; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREVIOUS_TAG}/" "${DEPLOY_DIR}/.env"
              docker-compose -f docker-compose.prod.yml up -d
              sleep 30
              verify && echo "rolled back to ${PREVIOUS_TAG}" || echo "rollback did not restore a healthy service"
            else
              echo "no previous image recorded; cannot roll back"
            fi
            exit 1
          fi
          SCRIPT

      - name: Sync runtime parameters
        env:
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE || 'prod' }}
          SPRING_PORT: ${{ secrets.SPRING_PORT || '8080' }}
          FASTAPI_PORT: ${{ secrets.FASTAPI_PORT || '8001' }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || '6379' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AI_SERVER_BASE_URL: ${{ secrets.AI_SERVER_BASE_URL || 'http://ai-server-disabled.invalid' }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || '5432' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_FRONTEND_REDIRECT_URL: ${{ secrets.APP_FRONTEND_REDIRECT_URL || 'https://app.jobai.site/oauth2/redirect' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBSOCKET_ALLOWED_ORIGINS: ${{ secrets.WEBSOCKET_ALLOWED_ORIGINS || 'https://app.jobai.site' }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_USERNAME: ${{ secrets.SENDGRID_USERNAME }}
          SENDGRID_PASSWORD: ${{ secrets.SENDGRID_PASSWORD }}
        run: |
          put_param() {
            local name="$1"
            local value="${2:-__EMPTY__}"

            aws ssm put-parameter \
              --name "/jobai/prod/env/${name}" \
              --type "SecureString" \
              --value "${value}" \
              --overwrite >/dev/null
          }

          put_param ECR_REGISTRY "${ECR_REGISTRY}"
          put_param IMAGE_TAG "${IMAGE_TAG}"
          put_param SPRING_PROFILES_ACTIVE "${SPRING_PROFILES_ACTIVE}"
          put_param SPRING_PORT "${SPRING_PORT}"
          put_param FASTAPI_PORT "${FASTAPI_PORT}"
          put_param REDIS_PORT "${REDIS_PORT}"
          put_param REDIS_PASSWORD "${REDIS_PASSWORD}"
          put_param AI_SERVER_BASE_URL "${AI_SERVER_BASE_URL}"
          put_param POSTGRES_HOST "${POSTGRES_HOST}"
          put_param POSTGRES_PORT "${POSTGRES_PORT}"
          put_param POSTGRES_DB "${POSTGRES_DB}"
          put_param POSTGRES_USER "${POSTGRES_USER}"
          put_param POSTGRES_PASSWORD "${POSTGRES_PASSWORD}"
          put_param APP_FRONTEND_REDIRECT_URL "${APP_FRONTEND_REDIRECT_URL}"
          put_param GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID}"
          put_param GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET}"
          put_param JWT_SECRET "${JWT_SECRET}"
          put_param WEBSOCKET_ALLOWED_ORIGINS "${WEBSOCKET_ALLOWED_ORIGINS}"
          put_param AWS_REGION "${AWS_REGION}"
          put_param S3_BUCKET_NAME "${S3_BUCKET_NAME}"
          put_param DATA_GO_KR_SERVICE_KEY "${DATA_GO_KR_SERVICE_KEY}"
          put_param SES_FROM_EMAIL "${SES_FROM_EMAIL}"
          put_param ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY}"
          put_param OPENAI_API_KEY "${OPENAI_API_KEY}"
          put_param SENDGRID_USERNAME "${SENDGRID_USERNAME}"
          put_param SENDGRID_PASSWORD "${SENDGRID_PASSWORD}"

      - name: Bootstrap EC2 deployment dependencies
        run: |
          cat > bootstrap-command.json <<'EOF'
          {
            "commands": [
              "set -e",
              "export DEBIAN_FRONTEND=noninteractive",
              "if ! command -v aws >/dev/null 2>&1 || ! command -v docker >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then apt-get update -qq; fi",
              "if ! command -v curl >/dev/null 2>&1; then apt-get install -y -qq curl; fi",
              "if ! command -v aws >/dev/null 2>&1; then apt-get install -y -qq awscli; fi",
              "if ! command -v docker >/dev/null 2>&1; then apt-get install -y -qq docker.io; systemctl enable docker; systemctl start docker; fi",
              "if command -v docker >/dev/null 2>&1; then systemctl enable docker; systemctl start docker; fi",
              "if ! command -v docker-compose >/dev/null 2>&1; then curl -fsSL \"https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)\" -o /usr/local/bin/docker-compose; chmod +x /usr/local/bin/docker-compose; fi",
              "aws --version",
              "docker --version",
              "docker-compose --version"
            ],
            "executionTimeout": ["1800"]
          }
          EOF

          command_id=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=jobai-ec2" \
            --document-name "AWS-RunShellScript" \
            --comment "Bootstrap JobAI deployment dependencies" \
            --parameters file://bootstrap-command.json \
            --query "Command.CommandId" \
            --output text)

          instance_id=""
          for _ in {1..30}; do
            instance_id=$(aws ssm list-command-invocations \
              --command-id "${command_id}" \
              --query "CommandInvocations[0].InstanceId" \
              --output text)

            if [ "${instance_id}" != "None" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "${instance_id}" ] || [ "${instance_id}" = "None" ]; then
            echo "No SSM managed EC2 instance matched tag Name=jobai-ec2"
            exit 1
          fi

          status=""
          for _ in {1..360}; do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${instance_id}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "${status}" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${instance_id}" \
            --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json || true

          if [ "${status}" != "Success" ]; then
            exit 1
          fi

      - name: Deploy on EC2 through SSM
        run: |
          compose_b64=$(base64 -w 0 .deploy/docker-compose.prod.yml)
          nginx_conf_b64=$(base64 -w 0 .deploy/nginx/jobai-upload-size.conf)
          websocket_nginx_conf_b64=$(base64 -w 0 .deploy/nginx/jobai-websocket-proxy.conf)
          script_b64=$(base64 -w 0 .deploy/remote-deploy.sh)

          cat > ssm-command.json <<EOF
          {
            "commands": [
              "set -e",
              "mkdir -p /tmp/jobai-deploy/nginx",
              "printf '%s' '${compose_b64}' | base64 -d > /tmp/jobai-deploy/docker-compose.prod.yml",
              "printf '%s' '${nginx_conf_b64}' | base64 -d > /tmp/jobai-deploy/nginx/jobai-upload-size.conf",
              "printf '%s' '${websocket_nginx_conf_b64}' | base64 -d > /tmp/jobai-deploy/nginx/jobai-websocket-proxy.conf",
              "printf '%s' '${script_b64}' | base64 -d > /tmp/jobai-deploy/remote-deploy.sh",
              "bash /tmp/jobai-deploy/remote-deploy.sh"
            ],
            "executionTimeout": ["1800"]
          }
          EOF

          command_id=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=jobai-ec2" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy JobAI ${IMAGE_TAG}" \
            --parameters file://ssm-command.json \
            --query "Command.CommandId" \
            --output text)

          instance_id=""
          for _ in {1..30}; do
            instance_id=$(aws ssm list-command-invocations \
              --command-id "${command_id}" \
              --query "CommandInvocations[0].InstanceId" \
              --output text)

            if [ "${instance_id}" != "None" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "${instance_id}" ] || [ "${instance_id}" = "None" ]; then
            echo "No SSM managed EC2 instance matched tag Name=jobai-ec2"
            exit 1
          fi

          status=""
          for _ in {1..360}; do
            status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${instance_id}" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "${status}" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${instance_id}" \
            --query '{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
            --output json || true

          if [ "${status}" != "Success" ]; then
            exit 1
          fi
